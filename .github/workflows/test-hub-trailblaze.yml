name: Test Hub - Trailblaze

on:
  workflow_dispatch:
    inputs:
      test_hub_run_id:
        description: Test Hub correlation identifier
        required: true
        type: string
      provider_id:
        description: Controlled provider identifier
        required: true
        type: string
      test_id:
        description: Controlled Trailblaze catalog identifier
        required: true
        type: choice
        options: [login, search, checkout]
      browser:
        description: Controlled browser identifier
        required: true
        default: chromium
        type: choice
        options: [chromium]

permissions:
  contents: read

concurrency:
  group: test-hub-trailblaze-${{ inputs.test_hub_run_id }}
  cancel-in-progress: false

jobs:
  trailblaze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRAILBLAZE_VERSION: v2026.09.11
      PLAYWRIGHT_VERSION: 1.59.0
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      RESULT_DIR: ${{ github.workspace }}/.test-hub-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/test-hub/trailblaze
            ~/.cache/trailblaze/playwright-driver
            ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: trailblaze-${{ runner.os }}-${{ env.TRAILBLAZE_VERSION }}-pw-${{ env.PLAYWRIGHT_VERSION }}

      - name: Resolve controlled test
        id: catalog
        shell: bash
        env:
          PROVIDER_ID: ${{ inputs.provider_id }}
          TEST_ID: ${{ inputs.test_id }}
        run: |
          test "$PROVIDER_ID" = trailblaze || { echo 'Invalid provider ID' >&2; exit 2; }
          case "$TEST_ID" in
            login) trail='test-hub/providers/trailblaze/trails/login/login.trail.yaml' ;;
            search) trail='test-hub/providers/trailblaze/trails/search/search.trail.yaml' ;;
            checkout) trail='test-hub/providers/trailblaze/trails/checkout/checkout.trail.yaml' ;;
            *) echo 'Unknown controlled test ID' >&2; exit 2 ;;
          esac
          test -f "$trail" || { echo "Configured trail is unavailable: $trail" >&2; exit 2; }
          echo "trail=$trail" >> "$GITHUB_OUTPUT"

      - name: Install pinned Trailblaze release
        shell: bash
        run: |
          install_dir="$HOME/.cache/test-hub/trailblaze/$TRAILBLAZE_VERSION"
          mkdir -p "$install_dir"
          base="https://github.com/block/trailblaze/releases/download/$TRAILBLAZE_VERSION"
          curl --fail --location --retry 3 --output "$install_dir/trailblaze" "$base/trailblaze"
          curl --fail --location --retry 3 --output "$install_dir/trailblaze.jar" "$base/trailblaze.jar"
          printf '%s  %s\n%s  %s\n' \
            '31485b6869bcff33334efc2b5dd989b795bdb38ab308f026850266dc4912b007' "$install_dir/trailblaze" \
            'c919155cfcb091d2a70d3cbfa8af0bcefe50a76349cca9b390ee30185015f5f3' "$install_dir/trailblaze.jar" \
            | sha256sum --check --strict
          chmod +x "$install_dir/trailblaze"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install Chromium system dependencies
        run: npx --yes playwright@${PLAYWRIGHT_VERSION} install-deps chromium

      - name: Serve deterministic fixture
        run: |
          python3 -m http.server 4173 --directory test-hub/providers/trailblaze/smoke-site \
            > "$RUNNER_TEMP/test-hub-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/test-hub-http.pid"
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:4173/

      - name: Run Trailblaze and generate report
        id: run
        shell: bash
        env:
          TEST_HUB_RUN_ID: ${{ inputs.test_hub_run_id }}
        run: |
          mkdir -p "$RESULT_DIR"
          set +e
          export TRAILBLAZE_PLAYWRIGHT_DRIVER_REPO=https://repo.maven.apache.org/maven2
          output="$(trailblaze run --device web --no-daemon \
            --test-name "test-hub-$TEST_HUB_RUN_ID" \
            '${{ steps.catalog.outputs.trail }}' 2>&1)"
          trailblaze_exit_code=$?
          set -e
          printf '%s\n' "$output"
          session_id="$(printf '%s\n' "$output" | sed -n \
            -e 's/.*Session ID:[[:space:]]*\([A-Za-z0-9_-]*\).*/\1/p' \
            -e 's/.*Trace posted to server for session[[:space:]]*\([A-Za-z0-9_-]*\).*/\1/p' \
            | tail -1)"
          test -n "$session_id" || { echo 'Trailblaze did not emit a session ID' >&2; exit 3; }
          trailblaze report --id "$session_id" --output-dir "$RESULT_DIR"
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
          echo "trailblaze_exit_code=$trailblaze_exit_code" >> "$GITHUB_OUTPUT"

      - name: Write Test Hub metadata
        shell: bash
        env:
          TEST_HUB_RUN_ID: ${{ inputs.test_hub_run_id }}
          TEST_ID: ${{ inputs.test_id }}
          BROWSER: ${{ inputs.browser }}
        run: |
          jq -n \
            --arg run "$TEST_HUB_RUN_ID" \
            --arg test "$TEST_ID" \
            --arg browser "$BROWSER" \
            --arg session '${{ steps.run.outputs.session_id }}' \
            --argjson exitCode '${{ steps.run.outputs.trailblaze_exit_code }}' \
            '{schemaVersion:1,testHubRunId:$run,providerId:"trailblaze",
              executionMode:"github-actions",testId:$test,
              trailblazeVersion:"v2026.09.11",browser:$browser,
              status:"completed",sessionId:$session,trailblazeExitCode:$exitCode,
              workflow:"test-hub-trailblaze.yml"}' > "$RESULT_DIR/metadata.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-hub-trailblaze-${{ inputs.test_hub_run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
